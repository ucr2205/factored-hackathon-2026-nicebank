<html data-composition-variables='[{"id":"cues","type":"string","label":"Sentence start times (s, JSON)","default":"[0.4,2.4]"}]'>
<head><link rel="stylesheet" href="assets/brand.css" /></head>
<body>
<template>
  <div id="root" data-composition-id="title" data-width="1920" data-height="1080">
   <div class="nb-scene">
    <div id="title-bg" class="title-bg"></div>
    <div class="nb-center" id="title-q-wrap">
      <div class="nb-big" id="title-q"><span class="w">What</span> <span class="w">if</span> <span class="w">it</span> <span class="w">took</span> <span class="w nb-grad-text">a minute?</span></div>
    </div>
    <div class="nb-center" id="title-brand">
      <img id="title-logo" class="title-logo" src="assets/img/nicebank-mark-512.png" alt="" />
      <div id="title-word" class="title-word"><span>Nice</span><span class="rose">Bank</span></div>
      <div id="title-tag" class="title-tag">Disputes, settled in a minute.</div>
      <div id="title-url" class="title-url">
        <span class="lock"></span><span id="title-url-text"></span><span id="title-caret" class="caret"></span>
      </div>
    </div>
   </div>
  </div>

  <style>
    #root { position: absolute; inset: 0; }
    .title-bg { position: absolute; inset: 0; background: var(--gradient); opacity: 0; }
    #title-q { max-width: 1500px; }
    #title-q .w { display: inline-block; }
    .title-logo { width: 220px; height: 220px; border-radius: 52px; background: #fff; padding: 22px; box-shadow: 0 40px 140px rgba(0, 0, 0, 0.45); }
    .title-word { margin-top: 44px; font-weight: 900; font-size: 140px; letter-spacing: -0.05em; line-height: 1; }
    .title-word .rose { color: var(--rose); }
    .title-tag { margin-top: 26px; font-weight: 600; font-size: 46px; color: rgba(255, 255, 255, 0.85); letter-spacing: -0.01em; }
    .title-url {
      margin-top: 64px; display: flex; align-items: center; gap: 16px; padding: 22px 40px; min-width: 760px;
      border-radius: 999px; background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.25);
      font: 500 40px Inter, sans-serif; color: #fff;
    }
    .lock { width: 22px; height: 26px; border-radius: 5px; background: rgba(255, 255, 255, 0.8); position: relative; flex-shrink: 0; }
    .lock::before { content: ""; position: absolute; left: 4px; top: -11px; width: 14px; height: 14px; border: 3px solid rgba(255, 255, 255, 0.8); border-bottom: none; border-radius: 9px 9px 0 0; }
    .caret { width: 3px; height: 44px; background: #fff; }
  </style>

  <script>
    (function () {
      const cues = JSON.parse(window.__hyperframes.getVariables().cues);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#root", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, 0);
      const words = document.querySelectorAll("#title-q .w");
      words.forEach((w, i) =>
        tl.fromTo(w, { opacity: 0, y: 50, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, cues[0] + i * 0.2)
      );
      tl.fromTo("#title-q-wrap", { opacity: 1, scale: 1, filter: "blur(0px)" }, { opacity: 0, scale: 1.08, filter: "blur(20px)", duration: 0.5, ease: "power2.in", immediateRender: false }, cues[1] - 0.45);
      tl.fromTo("#title-bg", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "sine.inOut" }, cues[1] - 0.3);
      tl.fromTo("#title-logo", { opacity: 0, scale: 0.4, rotate: -8 }, { opacity: 1, scale: 1, rotate: 0, duration: 1.0, ease: "back.out(1.6)" }, cues[1] - 0.1);
      tl.fromTo("#title-word", { opacity: 0, y: 40, scale: 1.12 }, { opacity: 1, y: 0, scale: 1, duration: 1.0, ease: "power3.out" }, cues[1] + 0.25);
      tl.fromTo("#title-tag", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, cues[1] + 0.9);
      tl.fromTo("#title-url", { opacity: 0, y: 30, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, cues[1] + 1.3);
      // the address types itself, one character at a time
      const url = "hackathon.evon.solutions";
      const typed = { n: 0 };
      tl.to(typed, {
        n: url.length, duration: 1.1, ease: "none",
        onUpdate: () => (document.getElementById("title-url-text").textContent = url.slice(0, Math.round(typed.n))),
      }, cues[1] + 1.6);
      tl.fromTo("#title-caret", { opacity: 1 }, { opacity: 0, duration: 0.4, repeat: 6, yoyo: true, ease: "steps(1)" }, cues[1] + 1.4);

      window.__timelines = window.__timelines || {};
      window.__timelines["title"] = tl;
    })();
  </script>
</template>
</body>
</html>
