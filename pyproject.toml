[project]
name = "nicebank-disputes"
version = "0.1.0"
description = "Data, ETL, evaluation and tooling for the NiceBank dispute-intake system (Factored AI & Data Hackathon 2026)"
requires-python = ">=3.12,<3.14"

[tool.poetry]
package-mode = false   # scripts and tooling only; nothing is published as a package

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
duckdb = "^1.1"
polars = "^1.9"
pyarrow = ">=17"
pandera = { version = ">=0.20", extras = ["polars"] }
pandas = "^2.2"
psycopg = { version = "^3.2", extras = ["binary"] }
boto3 = "^1.35"
pyyaml = "^6.0"

# Machine learning (P3). Heavy (PyTorch via sentence-transformers): install with `poetry install --with ml`.
[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
scikit-learn = "^1.5"
sentence-transformers = "^3.1"
mlflow = "^2.16"
fastapi = ">=0.115"
uvicorn = { version = ">=0.30", extras = ["standard"] }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
httpx = ">=0.27"
pre-commit = "^3.8"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
