# Local stack. Start with: docker compose up -d   (copy .env.example to .env first)
# Every port is bound to 127.0.0.1: the stack uses local-dev passwords, so it must not be reachable from the LAN.
name: disputes

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bank_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      POSTGRES_DB: ${POSTGRES_DB:-bank}
      APP_DB_USER: ${APP_DB_USER:-app_user}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-change-me-app}
    ports: ["127.0.0.1:5433:5432"]   # host 5433 avoids clashing with a local PostgreSQL install
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--health-enabled=true",
              "--spi-theme-static-max-age=-1", "--spi-theme-cache-themes=false", "--spi-theme-cache-templates=false"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-kc}
      # Password-reset emails use the same mail service as the backend notifications (.env). The realm file
      # reads these at import (latam-bank-realm.json -> smtpServer); defaults keep the local Mailpit.
      # With credentials set, SSL and auth switch on (the Netnovation server listens on 465 with SSL).
      KC_SMTP_HOST: ${SMTP_HOST:-mailpit}
      KC_SMTP_PORT: ${SMTP_PORT:-1025}
      KC_SMTP_FROM: ${MAIL_FROM:-nicebank@evon.solutions}
      KC_SMTP_ENVELOPE_FROM: ${EMAIL_USERNAME:-}
      KC_SMTP_USER: ${EMAIL_USERNAME:-}
      KC_SMTP_PASSWORD: ${EMAIL_PASSWORD:-}
      KC_SMTP_SSL: ${EMAIL_PASSWORD:+true}
      KC_SMTP_AUTH: ${EMAIL_PASSWORD:+true}
      # The reset demo user (cliente20) gets the test inbox, so real reset emails never go to example.test.
      KC_DEMO_RESET_EMAIL: ${MAIL_REDIRECT_TO:-cliente20@example.test}
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
      - ./infra/keycloak/themes/nicebank:/opt/keycloak/themes/nicebank:ro
    depends_on: [mailpit]
    healthcheck:
      # The image ships without curl; probe the management port with bash /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mailpit:
    # Local mail catcher: Keycloak emails (password reset) land here instead of real inboxes.
    image: axllent/mailpit:v1.21
    environment:
      MP_WEBROOT: /mail                 # served under /mail/ (gateway path; direct: http://localhost:8025/mail/)
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      QUERY_BASE_PATH: /jaeger          # served under /jaeger/ (gateway path; direct: http://localhost:16686/jaeger/)
      # Monitor tab (rate, errors, duration per operation): reads the collector's span metrics from Prometheus.
      METRICS_STORAGE_TYPE: prometheus
      PROMETHEUS_SERVER_URL: http://prometheus:9090/prometheus
      PROMETHEUS_QUERY_NAMESPACE: traces_span_metrics
      PROMETHEUS_QUERY_NORMALIZE_CALLS: "true"
      PROMETHEUS_QUERY_NORMALIZE_DURATION: "true"
    ports: ["127.0.0.1:16686:16686"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/config.yaml:/etc/otelcol/config.yaml:ro
    ports: ["127.0.0.1:4318:4318"]   # OTLP/HTTP only; the backend exports over HTTP
    depends_on: [jaeger]

  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus",
              "--storage.tsdb.retention.time=15d", "--web.enable-lifecycle",
              # served under /prometheus/ (gateway path; direct: http://localhost:9090/prometheus/)
              "--web.route-prefix=/prometheus", "--web.external-url=${PUBLIC_URL:-http://localhost:8090}/prometheus/"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - promdata:/prometheus            # metrics survive restarts and recreation
    ports: ["127.0.0.1:9090:9090"]

  ml-service:
    build: ./ml/service
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      HTTP_ADDR: ":8081"
      DATABASE_URL: postgres://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:-change-me-app}@postgres:5432/${POSTGRES_DB:-bank}
      ML_SERVICE_URL: http://ml-service:8000
      # Tokens carry the browser-facing issuer; signing keys are fetched over the internal network.
      OIDC_ISSUER: http://localhost:8080/realms/latam-bank
      OIDC_JWKS_URL: http://keycloak:8080/realms/latam-bank/protocol/openid-connect/certs
      OIDC_AUDIENCE: disputes-api
      POLICY_FILE: /policies/disputes.yaml
      DEMO_TODAY: ${DEMO_TODAY:-2026-06-17}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: disputes-backend
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      PII_KEY: ${PII_KEY:?PII_KEY is missing - run make env}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      # Email notifications: Mailpit by default; see .env.example for the real SMTP server.
      NOTIFY_ENABLED: ${NOTIFY_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURITY: ${SMTP_SECURITY:-none}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-nicebank@evon.solutions}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-NiceBank}
      MAIL_REDIRECT_TO: ${MAIL_REDIRECT_TO:-}
      MAIL_BCC: ${MAIL_BCC:-}
      MAIL_APP_URL: ${MAIL_APP_URL:-http://localhost:8088/chat}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8090}   # the gateway's origin, allowed by CORS
      MAIL_ALLOW_REAL_RECIPIENTS: ${MAIL_ALLOW_REAL_RECIPIENTS:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-deepseek-v4-pro}
      LLM_COMPOSE: ${LLM_COMPOSE:-template}
    volumes:
      - ./policies:/policies:ro
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      ml-service: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        VITE_TOOLS_URL: ${PUBLIC_URL:-http://localhost:8090}
    ports: ["127.0.0.1:8088:80"]   # production build; for development use `npm run dev` (port 5173)
    depends_on: [backend]

  gateway:
    # One public entry point, routed by path: the app at /, the API at /api, and Jaeger, Prometheus and Mailpit
    # at /jaeger, /prometheus and /mail behind a username and password (`make env` creates it in .env).
    # Locally: http://localhost:8090. In a deployment set SITE_ADDRESS to the public domain and PUBLIC_URL to
    # https://<domain>, and publish ports 80 and 443 instead: Caddy then gets the HTTPS certificate by itself.
    image: caddy:2.9-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      TOOLS_USER: ${TOOLS_USER:-equipo}
      TOOLS_PASSWORD_HASH: ${TOOLS_PASSWORD_HASH:-}   # empty: only the gateway refuses to start (run make env)
    volumes:
      - ./infra/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data                 # HTTPS certificates when SITE_ADDRESS is a real domain
    ports: ["127.0.0.1:${GATEWAY_PORT:-8090}:80"]
    depends_on: [frontend, backend, jaeger, prometheus, mailpit]

volumes:
  pgdata:
  promdata:
  caddydata:
