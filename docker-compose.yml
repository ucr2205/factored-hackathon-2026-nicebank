# Local stack. Start with: docker compose up -d   (copy .env.example to .env first)
name: disputes

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bank_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      POSTGRES_DB: ${POSTGRES_DB:-bank}
      APP_DB_USER: ${APP_DB_USER:-app_user}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-change-me-app}
    ports: ["5433:5432"]   # host 5433 avoids clashing with a local PostgreSQL install
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--health-enabled=true",
              "--spi-theme-static-max-age=-1", "--spi-theme-cache-themes=false", "--spi-theme-cache-templates=false"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-kc}
    ports: ["8080:8080"]
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
      - ./infra/keycloak/themes/nicebank:/opt/keycloak/themes/nicebank:ro
    depends_on: [mailpit]
    healthcheck:
      # The image ships without curl; probe the management port with bash /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mailpit:
    # Local mail catcher: Keycloak emails (password reset) land here instead of real inboxes.
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/config.yaml:/etc/otelcol/config.yaml:ro
    ports: ["4317:4317", "4318:4318"]
    depends_on: [jaeger]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  ml-service:
    build: ./ml/service
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      HTTP_ADDR: ":8081"
      DATABASE_URL: postgres://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:-change-me-app}@postgres:5432/${POSTGRES_DB:-bank}
      ML_SERVICE_URL: http://ml-service:8000
      # Tokens carry the browser-facing issuer; signing keys are fetched over the internal network.
      OIDC_ISSUER: http://localhost:8080/realms/latam-bank
      OIDC_JWKS_URL: http://keycloak:8080/realms/latam-bank/protocol/openid-connect/certs
      OIDC_AUDIENCE: disputes-api
      POLICY_FILE: /policies/disputes.yaml
      DEMO_TODAY: ${DEMO_TODAY:-2026-06-17}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: disputes-backend
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
    volumes:
      - ./policies:/policies:ro
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      ml-service: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports: ["8088:80"]   # production build; for development use `npm run dev` (port 5173)
    depends_on: [backend]

volumes:
  pgdata:
