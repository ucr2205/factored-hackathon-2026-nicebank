[project]
name = "ml-service"
version = "0.2.0"
description = "Dispute-type classifier and embeddings API (contract C2)"
requires-python = ">=3.12,<3.14"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = "^0.115.5"
uvicorn = { version = "^0.32.1", extras = ["standard"] }
prometheus-client = "^0.21.0"
numpy = ">=1.26"
scipy = ">=1.13"
scikit-learn = "^1.5"
sentence-transformers = "^3.1"
# CPU-only wheels: the service never uses a GPU and the CUDA build would add ~2 GB to the image.
torch = { version = "^2.5", source = "pytorch-cpu" }

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
