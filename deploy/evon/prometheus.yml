# Prometheus de NiceBank en el servidor EVON (nicebank-prometheus). Mismos nombres de job que el entorno local
# (infra/prometheus/prometheus.yml), así las reglas y alertas de infra/prometheus/rules.yml valen tal cual.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["nicebank-b:8013"]
  - job_name: ml-service
    metrics_path: /metrics/
    static_configs:
      - targets: ["nicebank-ml:8000"]
  - job_name: spanmetrics
    static_configs:
      - targets: ["nicebank-otel:8889"]
