# NiceBank en un solo dominio: hackathon.evon.solutions
# Pegar DENTRO del bloque `server { listen 443 ssl; server_name hackathon.evon.solutions; ... }`
# que ya creaste (el de los certificados). Deja tu bloque del puerto 80 redirigiendo a https.
#
#   /        -> frontend  (127.0.0.1:3013)
#   /api/    -> backend   (127.0.0.1:8013)
#   /auth/   -> Keycloak  (127.0.0.1:8180)
#   /jaeger/ y /prometheus/ -> herramientas del equipo, con usuario y contraseña (opcional, ver abajo)
#
# Después:  sudo nginx -t && sudo systemctl reload nginx

    # Los tokens y cookies de Keycloak son grandes: sin esto el login puede dar "502 upstream sent too big header".
    proxy_buffer_size        128k;
    proxy_buffers            4 256k;
    proxy_busy_buffers_size  256k;
    client_max_body_size     1m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---------- Keycloak ----------
    # La consola de administración y el realm "master" (login de admins) solo desde IPs de confianza.
    # CAMBIAR 203.0.113.10 por tu IP o la red de tu VPN; puedes repetir "allow" varias veces.
    location ~ ^/auth/(admin|realms/master)(/|$) {
        allow 203.0.113.10;
        deny  all;
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
    }

    # La raíz de Keycloak redirige a la consola de admin: mejor mandar al usuario a la app.
    location = /auth/ {
        return 302 /;
    }

    # Login, TOTP, recuperación de contraseña, tokens y recursos del tema.
    # Sin barra final en proxy_pass: se conserva el prefijo /auth/ (Keycloak está configurado con él).
    location /auth/ {
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
    }

    # ---------- Backend ----------
    # Solo /api/: así /metrics del backend no queda público.
    location /api/ {
        proxy_pass http://127.0.0.1:8013;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;   # un turno de chat con el LLM tarda ~1-2 s; margen para el modelo de respaldo
    }

    # ---------- Herramientas del equipo (opcional): trazas y métricas con usuario y contraseña ----------
    # Jaeger y Prometheus no tienen login propio: nginx lo pide (auth_basic). Crear el archivo una vez:
    #   sudo htpasswd -c /etc/nginx/nicebank-tools.htpasswd equipo        (paquete apache2-utils)
    # Para restringir además por IP, agrega "allow <tu IP>; deny all;" como en /auth/admin.
    # Sin estos bloques, Jaeger sigue disponible solo por túnel SSH (127.0.0.1:16686).
    location /jaeger/ {
        auth_basic           "NiceBank - herramientas";
        auth_basic_user_file /etc/nginx/nicebank-tools.htpasswd;
        proxy_pass http://127.0.0.1:16686;   # Jaeger corre con QUERY_BASE_PATH=/jaeger: se conserva el prefijo
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /prometheus/ {
        auth_basic           "NiceBank - herramientas";
        auth_basic_user_file /etc/nginx/nicebank-tools.htpasswd;
        proxy_pass http://127.0.0.1:9091;    # Prometheus corre con --web.route-prefix=/prometheus
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Frontend (SPA) ----------
    location / {
        proxy_pass http://127.0.0.1:3013;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
