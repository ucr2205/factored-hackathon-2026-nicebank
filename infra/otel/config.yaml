# Traces: services -> collector (OTLP) -> Jaeger. Metrics are scraped by Prometheus directly from services.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch: {}
  # Defense in depth: drop attributes that could carry personal data if a service sets them by mistake.
  # Patterns rather than exact keys, so naming variants are caught too.
  attributes/strip_pii:
    actions:
      - { pattern: '^(customer|user|enduser)\..*', action: delete }
      - { pattern: '(?i).*(email|first_name|last_name|full_name|document_number|phone|card_number|customer_ref|prompt|completion|message\.text|authorization|cookie).*', action: delete }
      # client.address is kept on purpose (validation and investigations): the backend sets it to the validated
      # client IP (TRUSTED_PROXIES rules). The raw TCP peer is dropped, since behind a proxy it is the proxy.
      - { key: network.peer.address, action: delete }

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: { insecure: true }

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/strip_pii, batch]
      exporters: [otlp/jaeger]
