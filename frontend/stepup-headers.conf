# Only for /stepup-callback.html: the landing page of the step-up iframe. Unlike the rest of the app it may be
# framed, but only by the app itself, and it runs nothing but its own script. It never sends a Referer (its URL
# carries the authorization code).
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Cache-Control "no-store" always;
